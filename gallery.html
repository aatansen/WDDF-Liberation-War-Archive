<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Liberation War Archive</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
    <div class="container nav">
        <h2>Liberation War Archive</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="documents.html">Documents</a>
            <a href="interviews.html">Interviews</a>
            <a class="active" href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>
</header>

<main>
<section class="page-title">
    <div class="container">
        <h1>Photographs Gallery</h1>
        <p>Photographs related to the Liberation War of 1971.</p>
    </div>
</section>

<section class="container section">
    <div class="gallery">
        <div class="gallery-item" onclick="openImage('assets/images/img-1.jpg', 'Historical photograph')">
            <img src="assets/images/img-1.jpg" alt="Historical photograph">
            <p>Historical Photograph</p>
        </div>
        <div class="gallery-item" onclick="openImage('assets/images/img-2.png', 'People during the Liberation War')">
            <img src="assets/images/img-2.png" alt="People during the Liberation War">
            <p>People During the War</p>
        </div>
        <div class="gallery-item" onclick="openImage('assets/images/img-3.jpg', 'Historical location')">
            <img src="assets/images/img-3.jpg" alt="Historical location">
            <p>Historical Location</p>
        </div>
    </div>
</section>
</main>

<div id="imageModal" class="modal">
    <div class="image-box">
        <button class="close" onclick="closeImage()">X</button>
        <img id="largeImage" src="" alt="">
        <p id="imageCaption"></p>
        <a id="downloadImage" class="button" href="" download>Download Image</a>
    </div>
</div>

<footer>
    <p>&copy; 2026 Liberation War Archive</p>
</footer>
<script src="assets/script.js"></script>
</body>
</html>
